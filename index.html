<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Responsive Mobile Viewport & Safe Area Support -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#002045" id="themeColorMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Tech Crew - College Complaint & Grievance Portal">
  
  <title>Tech Crew - Complaint Portal</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo.png">
  
  <!-- Google Fonts: Manrope & Work Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Material Symbols Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  
  <!-- External Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top App Bar / Sticky Header -->
  <header class="top-header">
    <div class="header-container">
      <a href="#" class="brand-section" id="brandHomeBtn" aria-label="Tech Crew Home">
        <div class="brand-logo-wrapper">
          <img src="logo.png" alt="Tech Crew Logo" class="brand-logo-img" width="40" height="40">
        </div>
        <div class="brand-text">
          <h1>Tech Crew</h1>
          <span class="brand-subtitle">Complaint Portal</span>
        </div>
      </a>

      <div class="header-actions">
        <!-- Theme Toggle -->
        <button class="icon-btn" id="themeToggleBtn" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
          <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="main-content">

    <!-- 1. File a Complaint Section (Title, Description, Submit) -->
    <section class="card-panel" aria-labelledby="fileComplaintHeading">
      <div class="panel-header">
        <div class="panel-title-group">
          <span class="material-symbols-outlined" aria-hidden="true">edit_note</span>
          <h2 class="panel-title" id="fileComplaintHeading">File a Complaint</h2>
        </div>
      </div>

      <form id="complaintForm" class="complaint-form" novalidate>
        <!-- Title Input -->
        <div class="form-group">
          <label class="form-label" for="title">Title</label>
          <input 
            type="text" 
            id="title" 
            name="title" 
            class="form-input" 
            placeholder="Brief summary of the issue"
            autocomplete="off"
            autocapitalize="sentences"
            required>
        </div>

        <!-- Description Textarea -->
        <div class="form-group">
          <label class="form-label" for="description">Description</label>
          <textarea 
            id="description" 
            name="description" 
            class="form-textarea" 
            rows="4"
            placeholder="Provide detailed information about the grievance..." 
            autocapitalize="sentences"
            required></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn" id="submitBtn">
          <span>File a Complaint</span>
        </button>
      </form>
    </section>

    <!-- 2. Complaints Section -->
    <section class="card-panel" aria-labelledby="complaintsHeading">
      <div class="panel-header">
        <div class="panel-title-group">
          <span class="material-symbols-outlined" aria-hidden="true">format_list_bulleted</span>
          <h2 class="panel-title" id="complaintsHeading">Complaints</h2>
        </div>
        <button class="icon-btn" id="refreshFeedBtn" title="Refresh Complaints" aria-label="Refresh Complaints">
          <span class="material-symbols-outlined">refresh</span>
        </button>
      </div>

      <!-- Search Box -->
      <div class="feed-controls">
        <div class="search-box">
          <span class="material-symbols-outlined search-icon" aria-hidden="true">search</span>
          <input 
            type="text" 
            id="searchInput" 
            class="search-input" 
            placeholder="Search complaints..."
            autocomplete="off"
            aria-label="Search complaints">
          <button class="clear-search-btn" id="clearSearchBtn" aria-label="Clear search">
            <span class="material-symbols-outlined" style="font-size: 18px;">close</span>
          </button>
        </div>
      </div>

      <!-- Complaints Feed List -->
      <div class="complaints-list" id="complaintsList" aria-live="polite">
        <!-- Dynamically rendered -->
      </div>
    </section>

  </main>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer" role="alert" aria-live="assertive"></div>

  <!-- Footer -->
  <footer class="portal-footer">
    <p>
      &copy; 2026 Tech Crew &bull; Complaint Portal
    </p>
  </footer>

  <!-- Client Application Script -->
  <script src="app.js"></script>
</body>
</html>
