  <!-- Embedded Stylesheet (Guarantees CSS works in all environments: local file://, Live Server, Express, Vercel, WebView) -->
  <style>
    /* ==========================================================================
       Tech Crew - Complaint Management Portal
       Design System: Resolution Authority (Stitch Pro) - Mobile Responsive Edition
       ========================================================================== */

    :root {
      /* Stitch Design Tokens: Resolution Authority */
      --primary: #002045;
      --primary-hover: #1a365d;
      --primary-light: #2563eb;
      --primary-container: #1a365d;
      --on-primary: #ffffff;
      --primary-fixed: #d6e3ff;
      --on-primary-fixed: #001b3c;
      
      --secondary: #595f66;
      --secondary-container: #dde3eb;
      --on-secondary: #ffffff;
      --on-secondary-container: #5f656c;
      
      --background: #f9f9ff;
      --on-background: #111c2c;
      
      --surface: #ffffff;
      --surface-low: #f0f3ff;
      --surface-container: #e7eeff;
      --surface-card: #f8fafc;
      --surface-card-hover: #f1f5f9;
      --surface-dim: #cfdaf1;
      --surface-variant: #d8e3fa;
      --on-surface: #111c2c;
      --on-surface-variant: #43474e;
      
      --outline: #74777f;
      --outline-variant: #e2e8f0;
      --focus-ring: rgba(0, 32, 69, 0.16);
      
      /* Semantic Status Colors */
      --status-pending-bg: #fffbeb;
      --status-pending-text: #b45309;
      --status-pending-border: #fde68a;
      
      --status-review-bg: #eff6ff;
      --status-review-text: #1d4ed8;
      --status-review-border: #bfdbfe;
      
      --status-progress-bg: #f5f3ff;
      --status-progress-text: #6d28d9;
      --status-progress-border: #ddd6fe;
      
      --status-resolved-bg: #ecfdf5;
      --status-resolved-text: #047857;
      --status-resolved-border: #a7f3d0;

      /* Typography */
      --font-headline: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-body: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      
      /* Radius & Elevation */
      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 18px;
      --radius-full: 9999px;
      
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 4px 12px -2px rgba(0, 20, 50, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 10px 25px -3px rgba(0, 20, 50, 0.12);
      --shadow-toast: 0 12px 32px -4px rgba(0, 20, 50, 0.28);
      
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --header-height: 64px;
    }

    /* Dark Mode Tokens */
    [data-theme="dark"] {
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --primary-light: #60a5fa;
      --primary-container: #0c4a6e;
      --on-primary: #001b3c;
      --primary-fixed: #075985;
      
      --background: #0b111a;
      --on-background: #e1e8f5;
      
      --surface: #111a28;
      --surface-low: #152234;
      --surface-container: #1b2a40;
      --surface-card: #141f2e;
      --surface-card-hover: #1c2b40;
      --on-surface: #f1f5fc;
      --on-surface-variant: #94a3b8;
      
      --outline-variant: #223247;
      --outline: #64748b;
      --focus-ring: rgba(56, 189, 248, 0.25);

      --status-pending-bg: rgba(234, 179, 8, 0.15);
      --status-pending-text: #fde047;
      --status-pending-border: rgba(234, 179, 8, 0.3);

      --status-review-bg: rgba(59, 130, 246, 0.15);
      --status-review-text: #93c5fd;
      --status-review-border: rgba(59, 130, 246, 0.3);

      --status-progress-bg: rgba(168, 85, 247, 0.15);
      --status-progress-text: #d8b4fe;
      --status-progress-border: rgba(168, 85, 247, 0.3);

      --status-resolved-bg: rgba(16, 185, 129, 0.15);
      --status-resolved-text: #6ee7b7;
      --status-resolved-border: rgba(16, 185, 129, 0.3);
    }

    /* ==========================================================================
       Base & Reset Styles
       ========================================================================== */

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--background);
      color: var(--on-background);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-headline);
      font-weight: 700;
      color: var(--on-surface);
      line-height: 1.3;
    }

    button, input, textarea {
      touch-action: manipulation;
    }

    /* ==========================================================================
       Top App Bar Header (Responsive & Safe Area Aware)
       ========================================================================== */

    .top-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--outline-variant);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--shadow-sm);
      padding-top: env(safe-area-inset-top, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .header-container {
      max-width: 768px;
      margin: 0 auto;
      padding: 0 16px;
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      min-width: 0;
      user-select: none;
    }

    .brand-logo-wrapper {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-text h1 {
      font-size: clamp(16px, 4.5vw, 19px);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--primary);
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-subtitle {
      font-size: clamp(9.5px, 2.5vw, 10.5px);
      font-weight: 600;
      color: var(--secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: block;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Header Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--outline-variant);
      background: var(--surface);
      color: var(--on-surface-variant);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      outline: none;
      user-select: none;
    }

    .icon-btn .material-symbols-outlined {
      font-size: 20px;
      transition: transform 0.2s ease;
    }

    .icon-btn:hover {
      background: var(--surface-low);
      color: var(--primary);
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .icon-btn:focus-visible {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    /* ==========================================================================
       Main Content Container (Fluid & Centered)
       ========================================================================== */

    .main-content {
      max-width: 768px;
      margin: 0 auto;
      padding: clamp(16px, 3.5vw, 24px) clamp(12px, 3vw, 16px) calc(clamp(28px, 6vw, 48px) + env(safe-area-inset-bottom, 0px));
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: clamp(16px, 3.5vw, 24px);
      padding-left: calc(clamp(12px, 3vw, 16px) + env(safe-area-inset-left, 0px));
      padding-right: calc(clamp(12px, 3vw, 16px) + env(safe-area-inset-right, 0px));
    }

    /* ==========================================================================
       Section Card Panels
       ========================================================================== */

    .card-panel {
      background: var(--surface-card);
      border: 1px solid var(--outline-variant);
      border-radius: var(--radius-xl);
      padding: clamp(16px, 3.5vw, 22px);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 3vw, 16px);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .panel-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-title-group .material-symbols-outlined {
      color: var(--primary);
      font-size: clamp(20px, 4.5vw, 22px);
    }

    .panel-title {
      font-size: clamp(16px, 4vw, 18px);
      font-weight: 700;
      color: var(--on-surface);
      letter-spacing: -0.01em;
    }

    /* ==========================================================================
       Grievance Form (Mobile Optimized Form Controls)
       ========================================================================== */

    .complaint-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--on-surface-variant);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .form-input,
    .form-textarea {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      background-color: var(--surface);
      border: 1.5px solid var(--outline-variant);
      border-radius: var(--radius-lg);
      color: var(--on-surface);
      font-family: var(--font-body);
      /* Crucial: 16px font-size prevents iOS Safari from automatically zooming the page on focus */
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    .form-textarea {
      height: auto;
      padding: 12px 14px;
      resize: vertical;
      min-height: 100px;
      line-height: 1.5;
    }

    .form-input::placeholder,
    .form-textarea::placeholder {
      color: var(--secondary);
      opacity: 0.7;
    }

    .form-input:focus,
    .form-textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    /* Submit Button */
    .submit-btn {
      height: 48px;
      background: var(--primary);
      color: var(--on-primary);
      border: none;
      border-radius: var(--radius-lg);
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 4px;
      width: 100%;
      user-select: none;
      box-shadow: var(--shadow-sm);
    }

    .submit-btn:hover {
      background: var(--primary-hover);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ==========================================================================
       Feed Controls: Search Box
       ========================================================================== */

    .feed-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      height: 44px;
      padding: 0 40px 0 40px;
      background: var(--surface);
      border: 1.5px solid var(--outline-variant);
      border-radius: var(--radius-lg);
      font-family: var(--font-body);
      /* 16px font-size prevents iOS auto-zoom */
      font-size: 16px;
      color: var(--on-surface);
      outline: none;
      transition: var(--transition);
      -webkit-appearance: none;
      appearance: none;
    }

    .search-input::placeholder {
      color: var(--secondary);
      opacity: 0.7;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--secondary);
      font-size: 20px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clear-search-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--secondary);
      cursor: pointer;
      display: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .clear-search-btn:hover {
      background: var(--surface-low);
      color: var(--primary);
    }

    .clear-search-btn:active {
      transform: translateY(-50%) scale(0.9);
    }

    /* ==========================================================================
       Complaints List Feed & Cards (Responsive & Word-Wrapping)
       ========================================================================== */

    .complaints-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-state {
      text-align: center;
      padding: clamp(28px, 6vw, 40px) 16px;
      color: var(--secondary);
      background: var(--surface);
      border: 1.5px dashed var(--outline-variant);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .empty-state .material-symbols-outlined {
      font-size: clamp(36px, 8vw, 44px);
      color: var(--outline);
      margin-bottom: 8px;
    }

    .empty-state h4 {
      font-size: clamp(14px, 3.5vw, 15px);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .empty-state p {
      font-size: clamp(12px, 3vw, 13px);
    }

    /* Complaint Card Component */
    .complaint-card {
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: var(--radius-lg);
      padding: clamp(14px, 3.5vw, 18px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .complaint-card:hover {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .complaint-card:active {
      transform: scale(0.99);
    }

    .complaint-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .complaint-title {
      font-size: clamp(15px, 3.8vw, 16.5px);
      font-weight: 700;
      color: var(--on-surface);
      line-height: 1.35;
      flex: 1;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: var(--radius-full);
      letter-spacing: 0.03em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-badge.Pending {
      background: var(--status-pending-bg);
      color: var(--status-pending-text);
      border: 1px solid var(--status-pending-border);
    }

    .status-badge.Under-Review,
    .status-badge.Under\ Review {
      background: var(--status-review-bg);
      color: var(--status-review-text);
      border: 1px solid var(--status-review-border);
    }

    .status-badge.Resolved {
      background: var(--status-resolved-bg);
      color: var(--status-resolved-text);
      border: 1px solid var(--status-resolved-border);
    }

    .complaint-description {
      font-size: clamp(13.5px, 3.2vw, 14.5px);
      color: var(--on-surface-variant);
      line-height: 1.55;
      word-break: break-word;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .complaint-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-size: 12px;
      color: var(--secondary);
      padding-top: 6px;
      border-top: 1px solid rgba(0, 0, 0, 0.04);
      margin-top: 4px;
    }

    [data-theme="dark"] .complaint-meta {
      border-top-color: rgba(255, 255, 255, 0.04);
    }

    .complaint-date {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--secondary);
    }

    /* ==========================================================================
       Toast Notifications (Mobile Screen Centered)
       ========================================================================== */

    .toast-container {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      right: 20px;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      max-width: calc(100vw - 32px);
    }

    .toast {
      pointer-events: auto;
      background: #002045;
      color: #ffffff;
      padding: 12px 18px;
      border-radius: var(--radius-lg);
      font-size: 14px;
      font-weight: 500;
      box-shadow: var(--shadow-toast);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideInToast 0.25s forwards ease;
      backdrop-filter: blur(8px);
    }

    .toast.success { background: #065f46; }
    .toast.error { background: #991b1b; }
    .toast.info { background: #1e3a8a; }

    @keyframes slideInToast {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* ==========================================================================
       Footer (Mobile Friendly Spacing)
       ========================================================================== */

    .portal-footer {
      margin-top: auto;
      background: var(--surface);
      border-top: 1px solid var(--outline-variant);
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
      text-align: center;
      font-size: 12.5px;
      color: var(--secondary);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    /* ==========================================================================
       Media Queries & Responsive Breakpoints
       ========================================================================== */

    /* Mobile Phones (<= 640px) */
    @media (max-width: 640px) {
      :root {
        --header-height: 58px;
      }

      .header-container {
        padding: 0 12px;
      }

      .brand-logo-wrapper {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-sm);
      }

      .brand-text h1 {
        font-size: 17px;
      }

      .brand-subtitle {
        font-size: 9.5px;
        letter-spacing: 0.06em;
      }

      .icon-btn {
        width: 38px;
        height: 38px;
      }

      .card-panel {
        border-radius: var(--radius-lg);
        padding: 16px 14px;
        gap: 14px;
      }

      .form-input,
      .form-textarea {
        font-size: 16px; /* Ensures no zoom on iOS */
        padding: 0 12px;
      }

      .form-textarea {
        padding: 10px 12px;
        min-height: 95px;
      }

      .submit-btn {
        height: 46px;
        font-size: 14.5px;
      }

      .search-input {
        height: 42px;
        font-size: 16px;
        padding: 0 36px 0 36px;
      }

      .search-icon {
        left: 10px;
        font-size: 18px;
      }

      .complaint-card {
        padding: 14px 12px;
        border-radius: var(--radius-md);
      }

      /* Center toasts at the bottom on mobile */
      .toast-container {
        left: 16px;
        right: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        width: auto;
        align-items: center;
      }

      .toast {
        width: 100%;
        justify-content: center;
        text-align: center;
        font-size: 13.5px;
        padding: 11px 16px;
      }
    }

    /* Extra Small Phones (<= 380px) */
    @media (max-width: 380px) {
      :root {
        --header-height: 54px;
      }

      .header-container {
        padding: 0 10px;
        gap: 8px;
      }

      .brand-section {
        gap: 8px;
      }

      .brand-logo-wrapper {
        width: 32px;
        height: 32px;
      }

      .brand-text h1 {
        font-size: 15.5px;
      }

      .brand-subtitle {
        font-size: 9px;
      }

      .main-content {
        padding-left: calc(10px + env(safe-area-inset-left, 0px));
        padding-right: calc(10px + env(safe-area-inset-right, 0px));
      }

      .card-panel {
        padding: 14px 10px;
      }
    }
  </style>
</head>

      <div class="header-actions">
        <!-- Theme Toggle -->
        <button class="icon-btn" id="themeToggleBtn" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
          <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="main-content">

    <!-- 1. File a Complaint Section (Title, Description, Submit) -->
    <section class="card-panel" aria-labelledby="fileComplaintHeading">
      <div class="panel-header">
        <div class="panel-title-group">
          <span class="material-symbols-outlined" aria-hidden="true">edit_note</span>
          <h2 class="panel-title" id="fileComplaintHeading">File a Complaint</h2>
        </div>
      </div>

      <form id="complaintForm" class="complaint-form" novalidate>
        <!-- Title Input -->
        <div class="form-group">
          <label class="form-label" for="title">Title</label>
          <input 
            type="text" 
            id="title" 
            name="title" 
            class="form-input" 
            placeholder="Brief summary of the issue"
            autocomplete="off"
            autocapitalize="sentences"
            required>
        </div>

        <!-- Description Textarea -->
        <div class="form-group">
          <label class="form-label" for="description">Description</label>
          <textarea 
            id="description" 
            name="description" 
            class="form-textarea" 
            rows="4"
            placeholder="Provide detailed information about the grievance..." 
            autocapitalize="sentences"
            required></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn" id="submitBtn">
          <span>File a Complaint</span>
        </button>
      </form>
    </section>

    <!-- 2. Complaints Section -->
    <section class="card-panel" aria-labelledby="complaintsHeading">
      <div class="panel-header">
        <div class="panel-title-group">
          <span class="material-symbols-outlined" aria-hidden="true">format_list_bulleted</span>
          <h2 class="panel-title" id="complaintsHeading">Complaints</h2>
        </div>
        <button class="icon-btn" id="refreshFeedBtn" title="Refresh Complaints" aria-label="Refresh Complaints">
          <span class="material-symbols-outlined">refresh</span>
        </button>
      </div>

      <!-- Search Box -->
      <div class="feed-controls">
        <div class="search-box">
          <span class="material-symbols-outlined search-icon" aria-hidden="true">search</span>
          <input 
            type="text" 
            id="searchInput" 
            class="search-input" 
            placeholder="Search complaints..."
            autocomplete="off"
            aria-label="Search complaints">
          <button class="clear-search-btn" id="clearSearchBtn" aria-label="Clear search">
            <span class="material-symbols-outlined" style="font-size: 18px;">close</span>
          </button>
        </div>
      </div>

      <!-- Complaints Feed List -->
      <div class="complaints-list" id="complaintsList" aria-live="polite">
        <!-- Dynamically rendered -->
      </div>
    </section>

  </main>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer" role="alert" aria-live="assertive"></div>

  <!-- Footer -->
  <footer class="portal-footer">
    <p>
      &copy; 2026 Tech Crew &bull; Complaint Portal
    </p>
  </footer>

  <!-- Client Application Script -->
  <script src="app.js"></script>
