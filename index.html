<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Crew - Complaint Portal</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo.png">
  
  <!-- Google Fonts: Manrope (Headlines) & Work Sans (Body/Labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  
  <!-- Embedded Stitch Stylesheet for 100% Vercel / CDN compatibility -->
  <style>
    /* ==========================================================================
       Tech Crew - Complaint Management Portal
       Design System: Resolution Authority (Stitch Pro)
       ========================================================================== */

    :root {
      --primary: #002045;
      --primary-hover: #1a365d;
      --primary-container: #1a365d;
      --on-primary: #ffffff;
      --primary-fixed: #d6e3ff;
      --on-primary-fixed: #001b3c;
      
      --secondary: #595f66;
      --secondary-container: #dde3eb;
      --on-secondary: #ffffff;
      --on-secondary-container: #5f656c;
      
      --background: #f9f9ff;
      --on-background: #111c2c;
      
      --surface: #ffffff;
      --surface-low: #f0f3ff;
      --surface-container: #e7eeff;
      --surface-card: #f8fafc;
      --surface-card-hover: #f1f5f9;
      --surface-dim: #cfdaf1;
      --surface-variant: #d8e3fa;
      --on-surface: #111c2c;
      --on-surface-variant: #43474e;
      
      --outline: #74777f;
      --outline-variant: #e2e8f0;
      
      /* Typography */
      --font-headline: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-body: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      
      /* Radius & Shadows */
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-full: 9999px;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
      --shadow-modal: 0 20px 35px -5px rgba(0, 20, 50, 0.25);
      
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --primary-container: #0c4a6e;
      --on-primary: #001b3c;
      --primary-fixed: #075985;
      
      --background: #0b111a;
      --on-background: #e1e8f5;
      
      --surface: #111a28;
      --surface-low: #152234;
      --surface-container: #1b2a40;
      --surface-card: #152030;
      --surface-card-hover: #1c2b42;
      --on-surface: #f1f5fc;
      --on-surface-variant: #94a3b8;
      
      --outline-variant: #263852;
      --outline: #64748b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--background);
      color: var(--on-background);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-headline);
      font-weight: 700;
      color: var(--on-surface);
      line-height: 1.3;
    }

    /* Top App Bar Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--outline-variant);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .header-container {
      max-width: 768px;
      margin: 0 auto;
      padding: 0 16px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-logo-wrapper {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-text h1 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--primary);
      line-height: 1.1;
    }

    .brand-subtitle {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: block;
      margin-top: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--outline-variant);
      background: var(--surface);
      color: var(--on-surface-variant);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .icon-btn:hover {
      background: var(--surface-low);
      color: var(--primary);
      border-color: var(--primary);
    }

    .main-content {
      max-width: 768px;
      margin: 0 auto;
      padding: 24px 16px 48px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card-panel {
      background: var(--surface-card);
      border: 1px solid var(--outline-variant);
      border-radius: var(--radius-xl);
      padding: 22px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-title-group .material-symbols-outlined {
      color: var(--primary);
      font-size: 22px;
    }

    .panel-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--on-surface);
    }

    .complaint-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--on-surface-variant);
    }

    .form-input,
    .form-textarea {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      background-color: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: var(--radius-lg);
      color: var(--on-surface);
      font-family: var(--font-body);
      font-size: 15px;
      outline: none;
      transition: var(--transition);
    }

    .form-textarea {
      height: auto;
      padding: 14px 16px;
      resize: vertical;
      min-height: 110px;
    }

    .form-input:focus,
    .form-textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(0, 32, 69, 0.12);
    }

    .submit-btn {
      height: 48px;
      background: var(--primary);
      color: var(--on-primary);
      border: none;
      border-radius: var(--radius-lg);
      font-family: var(--font-body);
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 4px;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .feed-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      height: 42px;
      padding: 0 36px 0 38px;
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--on-surface);
      outline: none;
      transition: var(--transition);
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--secondary);
      font-size: 18px;
      pointer-events: none;
    }

    .clear-search-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--secondary);
      cursor: pointer;
      display: none;
    }

    .complaints-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--secondary);
      background: var(--surface);
      border: 1px dashed var(--outline-variant);
      border-radius: var(--radius-lg);
    }

    .empty-state .material-symbols-outlined {
      font-size: 40px;
      color: var(--outline);
      margin-bottom: 6px;
    }

    .complaint-card {
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: var(--transition);
    }

    .complaint-card:hover {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-sm);
    }

    .complaint-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .complaint-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--on-surface);
      line-height: 1.4;
      flex: 1;
    }

    .complaint-description {
      font-size: 14px;
      color: var(--on-surface-variant);
      line-height: 1.5;
    }

    .complaint-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-size: 12px;
      color: var(--secondary);
      padding-top: 6px;
      margin-top: 2px;
    }

    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      background: #002045;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      font-weight: 500;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      gap: 8px;
      animation: slideInToast 0.25s forwards ease;
    }

    .toast.success { background: #065f46; }
    .toast.error { background: #991b1b; }
    .toast.info { background: #1e3a8a; }

    @keyframes slideInToast {
      from { transform: translateY(15px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .portal-footer {
      margin-top: auto;
      background: var(--surface);
      border-top: 1px solid var(--outline-variant);
      padding: 16px;
      text-align: center;
      font-size: 12.5px;
      color: var(--secondary);
    }
  </style>
</head>
<body>

  <!-- Top App Bar / Sticky Header -->
  <header class="top-header">
    <div class="header-container">
      <a href="#" class="brand-section" id="brandHomeBtn">
        <div class="brand-logo-wrapper">
          <img src="logo.png" alt="Tech Crew Logo" class="brand-logo-img">
        </div>
        <div class="brand-text">
          <h1>Tech Crew</h1>
          <span class="brand-subtitle">Complaint Portal</span>
        </div>
      </a>

      <div class="header-actions">
        <!-- Theme Toggle -->
        <button class="icon-btn" id="themeToggleBtn" title="Toggle Dark/Light Mode">
          <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="main-content">

    <!-- 1. File a Complaint Section (Title, Description, Submit) -->
    <section class="card-panel">
      <div class="panel-header">
        <div class="panel-title-group">
          <span class="material-symbols-outlined">edit_note</span>
          <h2 class="panel-title">File a Complaint</h2>
        </div>
      </div>

      <form id="complaintForm" class="complaint-form">
        <!-- Title Input -->
        <div class="form-group">
          <label class="form-label" for="title">Title</label>
          <input type="text" id="title" name="title" class="form-input" placeholder="Brief summary of the issue"
            required>
        </div>

        <!-- Description Textarea -->
        <div class="form-group">
          <label class="form-label" for="description">Description</label>
          <textarea id="description" name="description" class="form-textarea" rows="4"
            placeholder="Provide detailed information about the grievance..." required></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn" id="submitBtn">
          <span>File a Complaint</span>
        </button>
      </form>
    </section>

    <!-- 2. Complaints Section -->
    <section class="card-panel">
      <div class="panel-header">
        <div class="panel-title-group">
          <span class="material-symbols-outlined">format_list_bulleted</span>
          <h2 class="panel-title">Complaints</h2>
        </div>
        <button class="icon-btn" id="refreshFeedBtn" title="Refresh Complaints">
          <span class="material-symbols-outlined">refresh</span>
        </button>
      </div>

      <!-- Search Box -->
      <div class="feed-controls">
        <div class="search-box">
          <span class="material-symbols-outlined search-icon">search</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Search complaints...">
          <button class="clear-search-btn" id="clearSearchBtn">
            <span class="material-symbols-outlined" style="font-size: 18px;">close</span>
          </button>
        </div>
      </div>

      <!-- Complaints Feed List -->
      <div class="complaints-list" id="complaintsList">
        <!-- Dynamically rendered -->
      </div>
    </section>

  </main>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Footer -->
  <footer class="portal-footer">
    <p>
      &copy; 2026 Tech Crew &bull; Complaint Portal
    </p>
  </footer>

  <!-- Client Application Script -->
  <script src="app.js"></script>
</body>
</html>
